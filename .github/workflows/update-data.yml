name: Update processing times

on:
  schedule:
    # USCIS refreshes its published times roughly monthly; check daily.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test the parser
        run: npm test

      - name: Fetch latest USCIS processing times
        run: node scripts/fetch-processing-times.mjs --raw-dir raw-responses

      # Every USCIS response this run used, kept for 90 days so any number on
      # the site can be traced back to exactly what USCIS returned.
      - name: Archive raw USCIS responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uscis-raw-${{ github.run_id }}
          path: raw-responses/
          retention-days: 90
          if-no-files-found: ignore

      - name: Validate before publishing
        run: |
          git show HEAD:data/processing-times.json > previous.json 2>/dev/null || echo '{"sample":true,"times":[]}' > previous.json
          node scripts/validate-data.mjs data/processing-times.json --previous previous.json

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- data/processing-times.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processing-times.json
          git commit -m "Update USCIS processing times (run ${{ github.run_id }})"
          git push
