name: Update processing times

on:
  schedule:
    # USCIS refreshes its published times roughly monthly; check daily.
    - cron: '17 9 * * *'
  workflow_dispatch:
  # Also refresh whenever the fetcher or office list changes.
  push:
    paths:
      - 'scripts/**'
      - 'data/offices.json'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test the parser
        run: npm test

      # USCIS blocks plain scripted requests from cloud servers, so fetch
      # through headless Chrome (see scripts/fetch-processing-times.mjs).
      # Uses the Google Chrome preinstalled on GitHub's runners.
      - name: Install Playwright
        timeout-minutes: 5
        run: npm install --no-save playwright@1

      - name: Fetch latest USCIS processing times
        timeout-minutes: 40
        run: node scripts/fetch-processing-times.mjs --browser --raw-dir raw-responses

      # Every USCIS response this run used, kept for 90 days so any number on
      # the site can be traced back to exactly what USCIS returned.
      - name: Archive raw USCIS responses
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: uscis-raw-${{ github.run_id }}
          path: raw-responses/
          retention-days: 90
          if-no-files-found: ignore

      - name: Validate before publishing
        run: |
          git show HEAD:data/processing-times.json > previous.json 2>/dev/null || echo '{"sample":true,"times":[]}' > previous.json
          node scripts/validate-data.mjs data/processing-times.json --previous previous.json

      - name: Commit updated data
        run: |
          if [ -z "$(git status --porcelain -- data/processing-times.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processing-times.json
          git commit -m "Update USCIS processing times (run ${{ github.run_id }})"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"
        id: commit

      # Pushes made with GITHUB_TOKEN may not trigger a Pages rebuild by themselves.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
